<!DOCTYPE html>
<html>
    <head>
        <script src="script.js"></script>
    </head>
    <body>
        <nav>
            <a href="index.html" style="color: black; margin: 0 10px;">Home</a>
        </nav>
        <h2>Test the buttons!</h2>
        <p>Each button does something different!</p>
        <div style="margin-top: 20px;">
            <img
                id="spider-image"
                src="images/spiderman.jpg"
                alt="SpiderMan"
                style="max-width: 100%; width: 900px; height: auto; border-radius: 8px;"
            >
        </div>
        <!-- Fixed targets, corrected image associations, and proper style/attribute updates -->
        <button type="button" onclick="document.getElementById('spider-image').src = 'images/spiderman.jpg'">Classic Suit!</button>
        <button type="button" onclick="document.getElementById('spider-image').src = 'images/BlackSuit.jpg'">Black Suit!</button>
        <button type="button" onclick="document.getElementById('spider-image').style.width = '400px'">Shrink Image</button>
        <button type="button" onclick="document.getElementById('spider-image').style.width = '900px'">Enlarge Image</button>
    </body>
</html>
